<!--
  Plantilla "Reset password" del panel de Supabase.

  Misma regla que en confirmacion.html: {{ .Token }} y nunca
  {{ .ConfirmationURL }}. Ver el comentario de ese archivo.
-->
<!DOCTYPE html>
<html lang="es">
  <body style="margin:0;padding:0;background:#f6f5fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f5fb;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border-radius:16px;padding:32px;box-shadow:0 2px 12px rgba(16,16,40,0.06);">
            <tr>
              <td style="font-size:20px;font-weight:700;color:#1b1b2f;padding-bottom:8px;">Cambia tu contrasena</td>
            </tr>
            <tr>
              <td style="font-size:15px;line-height:1.6;color:#55556d;padding-bottom:24px;">
                Escribe este codigo en LeadSeed para poder poner una contrasena nueva.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:24px;">
                <div style="display:inline-block;background:#f2effe;border:1px solid #ded6fb;border-radius:12px;padding:16px 28px;font-size:30px;font-weight:700;letter-spacing:6px;color:#603FE2;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#8a8aa3;">
                El codigo caduca en 5 minutos. Si no pediste cambiar la contrasena, ignora este correo: tu contrasena actual sigue funcionando.
              </td>
            </tr>
          </table>
          <div style="font-size:12px;color:#a0a0b8;padding-top:16px;">LeadSeed</div>
        </td>
      </tr>
    </table>
  </body>
</html>
