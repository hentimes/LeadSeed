name: CI

on:
  push:
    branches: [master, develop, design]
  pull_request:
    branches: [master, develop]

# Un push nuevo sobre la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El orden va de mas rapido y especifico a mas lento y global, para que
      # el fallo mas facil de diagnosticar aparezca primero.

      - name: Lint
        # Solo falla por violaciones de frontera arquitectonica; la deuda de
        # calidad es warning a proposito. Ver el encabezado de eslint.config.js.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        # `build` ya corre tsc antes de vite, pero se deja explicito para que un
        # fallo de empaquetado no se confunda con un fallo de tipos.
        run: npm run build
        env:
          # El cliente Supabase aborta el arranque si faltan estas variables.
          # Son valores de relleno: el build no hace ninguna llamada de red, y
          # los valores reales se inyectan al empaquetar la extension.
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
