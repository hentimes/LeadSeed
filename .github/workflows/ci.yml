name: CI

on:
  push:
    branches: [master, develop, design]
  pull_request:
    branches: [master, develop]

# Un push nuevo sobre la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El orden va de mas rapido y especifico a mas lento y global, para que
      # el fallo mas facil de diagnosticar aparezca primero.

      - name: Lint
        # Solo falla por violaciones de frontera arquitectonica; la deuda de
        # calidad es warning a proposito. Ver el encabezado de eslint.config.js.
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Modo oscuro sin contraparte
        # Detecta colores claros fijos (`bg-white`, `bg-gray-50`...) sin un
        # `dark:` al lado en el mismo className. En oscuro eso pinta blanco de
        # verdad, con el texto ya en claro encima: ilegible.
        #
        # Se llego a cero el `2026-08-14` partiendo de 122 bloques, ninguno de
        # ellos detectado por lint ni por tipos. Sin esta guarda, el primero que
        # vuelva pasa igual de desapercibido que los 122.
        # `python3` y no `python`: en el runner de Ubuntu el alias sin version
        # no esta garantizado, `python3` si.
        run: python3 scripts/audit-dark-gaps.py

      - name: Tests y umbral de cobertura
        # `test:coverage` y no `test`: el umbral de trinquete de
        # vitest.config.ts solo se evalua al medir cobertura. Corriendo `test`
        # a secas, el umbral existiria en la config y no se comprobaria nunca,
        # que es como tenerlo desactivado sin saberlo.
        run: npm run test:coverage

      - name: Build
        # `build` ya corre tsc antes de vite, pero se deja explicito para que un
        # fallo de empaquetado no se confunda con un fallo de tipos.
        run: npm run build
        env:
          # El cliente Supabase aborta el arranque si faltan estas variables.
          # Son valores de relleno: el build no hace ninguna llamada de red, y
          # los valores reales se inyectan al empaquetar la extension.
          VITE_SUPABASE_URL: http://localhost:54321
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key

      - name: Clases CSS muertas
        # Va DESPUES del build a proposito: compara contra el CSS que Tailwind
        # acaba de emitir. Con un dist/ viejo el resultado no significaria nada.
        #
        # Detecta clases que se usan pero no generan ninguna regla. Nacio de un
        # caso real: `dark:backdrop-blur-md/20`, que dejo un cuadrado en blanco
        # en el modal de soporte durante quien sabe cuanto, porque Tailwind
        # descarta en silencio lo que no entiende.
        run: npm run check:classes

      - name: Propiedad de Edge Functions
        # LeadSeed y landing-gerow comparten proyecto Supabase, asi que un
        # deploy desde el repo equivocado sobrescribe produccion sin avisar. Ya
        # paso con `form-leads` y con `form-progress`.
        #
        # Sin credenciales enlazadas sale con codigo 0 y un aviso, asi que aqui
        # comprueba lo que puede sin credenciales y no rompe el CI por algo que
        # no esta en su mano verificar. El valor completo se obtiene corriendolo
        # en local antes de un deploy.
        run: npm run check:functions
